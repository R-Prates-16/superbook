{% extends 'base.html' %}
{% block content %}
<!-- Tela de Listagem de Posts -->
<main>
  <header>
    <h1>Lista de Posts</h1>
    <p>Explore as publicações da nossa comunidade</p>
  </header>
  
  <section aria-labelledby="posts-list">
    <h2 id="posts-list" hidden>Posts Disponíveis</h2>
    {% for post in posts %}
      <article itemscope itemtype="http://schema.org/SocialMediaPosting">
        <header>
          <h3 itemprop="author">
            <a href="{% url 'detalhes_post' post.pk %}" itemprop="url">{{ post.autor.codinome }}</a>
          </h3>
        </header>
        
        <p itemprop="text">{{ post.mensagem|linebreaksbr }}</p>
        
        <footer>
          <nav>
            <ul>
              <li><a href="{% url 'editar_post' post.pk %}">✏️ Editar</a></li>
              <li><a href="{% url 'excluir_post' post.pk %}">🗑️ Excluir</a></li>
            </ul>
          </nav>
        </footer>
      </article>
    {% endfor %}
  </section>
</main>
{% endblock %}
