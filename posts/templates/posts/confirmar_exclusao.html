{% extends 'base.html' %}
{% block content %}
<!-- Tela de Confirmação de Exclusão Corrigida -->
<section>
  <header>
    <hgroup>
      <h1>Confirmar Exclusão</h1>
      <p>Ação irreversível - pense cuidadosamente</p>
    </hgroup>
  </header>
  
  <article>
    <p>Você está prestes a excluir permanentemente o post de <strong>{{ object.autor.codinome }}</strong>.</p>
    <p>Esta ação não pode ser desfeita.</p>
  </article>
  
  <form method="post">
    {% csrf_token %}
    <nav>
      <a href="{% url 'lista_posts' %}">↶ Cancelar</a>
      <button type="submit">🗑️ Excluir Permanentemente</button>
    </nav>
  </form>
</section>
{% endblock %}
