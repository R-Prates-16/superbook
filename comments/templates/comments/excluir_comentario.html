{% extends "base.html" %}
{% load static %}

{% block content %}
<link rel="stylesheet" href="{% static 'css/style.css' %}">

<div class="container mt-4">
    <div class="card">
        <div class="card-body">
            <h2 class="card-title mb-4">🗑️ Excluir Comentário</h2>
            
            <div class="alert alert-danger">
                <h5>⚠️ Tem certeza que deseja excluir este comentário?</h5>
                <p class="mb-0">"{{ object.conteudo|truncatewords:20 }}"</p>
            </div>

            <form method="POST">
                {% csrf_token %}
                
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-danger">
                        ✅ Sim, Excluir
                    </button>
                    <a href="{% url 'detalhe_post' object.post.pk %}" class="btn btn-secondary">
                        ❌ Cancelar
                    </a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
